name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 测试（宿主半 + 浏览器半）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile 保证与本地锁文件一致；安装后 prepare 会自动构建浏览器半。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 语法检查
        run: pnpm run check

      - name: 宿主半冒烟
        run: pnpm test

      # check:client = 产物契约 + 平台模块纯度门 + 契约冒烟
      - name: 浏览器半契约与纯度
        run: pnpm run check:client

      # dist/ 是提交进仓库的（这样从 git 安装无需构建审批），
      # 因此必须防止它与源码漂移：重新构建后若与提交的产物有差异，这一步会失败。
      - name: 提交的产物与重新构建一致
        run: pnpm run check:dist
